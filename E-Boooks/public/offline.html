
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CodeVerse | Offline</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f7f9fd;
            color: #202b40;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 480px;
            padding: 30px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow:
                0 10px 35px rgba(34, 51, 85, 0.13);
        }

        h1 {
            color: #3157a4;
        }

        p {
            line-height: 1.7;
        }

        a {
            color: #3157a4;
            text-decoration: none;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <main>
        <h1>CodeVerse Offline</h1>

        <p>
            You are currently offline.
            Your previously saved books can
            still be opened without an
            internet connection.
        </p>

        <p>
            Visit your library while online
            and save books before disconnecting.
        </p>

        <p>
            <a href="/index.html">
                Homepage
            </a>

            |

            <a href="/library.html">
                Saved Library
            </a>
        </p>
    </main>

    <script
        src="/js/offline.js"
        defer>
    </script>

</body>

</html>
