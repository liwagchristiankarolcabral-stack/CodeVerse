<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CodeVerse | Offline</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f5f7fc;
            color: #202b40;
        }

        .offline-container {
            max-width: 450px;
            padding: 35px;
            text-align: center;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,.07);
        }

        h1 {
            color: #3157a4;
        }

        button {
            padding: 12px 25px;
            background: #3157a4;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <main class="offline-container">
        <h1>CodeVerse Offline</h1>

        <p>
            You are currently offline.
            Connect to the internet to access
            features that have not been saved.
        </p>

        <button onclick="location.reload()">
            Try Again
        </button>
    </main>

</body>
</html>
